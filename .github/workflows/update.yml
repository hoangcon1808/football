name: Auto Update Streams Data

on:
  # Lắng nghe tín hiệu kích hoạt từ Cron-job.org
  repository_dispatch:
    types: [update-football]
  # Vẫn giữ chạy tự động mỗi 10 phút của GitHub để dự phòng
  schedule:
    - cron: '*/10 * * * *'
  # Cho phép bấm nút chạy thủ công
  workflow_dispatch:

# Cấp quyền ghi để bot có thể push file lên repo
permissions:
  contents: write

# Tự động hủy luồng cũ nếu có luồng mới được kích hoạt, tránh lỗi xung đột khi git push
concurrency:
  group: update-football-group
  cancel-in-progress: true

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: 2. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 4. Run Python script
        run: python main.py

      - name: 5. Commit and Push changes
        env:
          TZ: 'Asia/Ho_Chi_Minh'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Thêm các file JSON và HTML vào danh sách chuẩn bị commit
          git add tv.json full.json index.html
          
          # Kiểm tra nếu thực sự có sự thay đổi mới thì tiến hành commit và push
          if ! git diff --cached --quiet; then
            git commit -m "⚡ Auto update JSON & HTML [skip ci] - $(date '+%d/%m/%Y %H:%M:%S')"
            git push
            echo "✅ Đã cập nhật và push file thành công!"
          else
            echo "ℹ️ Không có thay đổi nào để commit."
          fi
